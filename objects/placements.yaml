# Single source of truth for where the scrub-nurse objects sit in the hospital (world frame = Isaac world =
# MuJoCo world, metres, yaw in radians about +z). Read by build_objects.py (theatre MJCF + USD),
# g1-isaac-sim/make_theatre_layer.py and the mission's MuJoCo theatre. Edit here, then run build.sh.
#
# Theatre (../isaac/scene/layout.py): wing-local x 0..10, y -20..-10  ->  world x 17.93..27.93, y -24.45..-14.45.
# Operating table (sm_surgicaltable_a01_01) spans world x 22.75..23.48, y -20.17..-17.95, top 0.94 m.
# Theatre door: world x 24.93..26.93 on y = -14.45.
frame: world

objects:
  instrument_table:            # Mayo-stand-like, tray top 0.78 m; local +x = far side (away from the robot)
    pos: [25.60, -20.60, 0.0]
    yaw: -1.5707963            # local +x -> world -y (robot stands north of it, facing south)
  tool_rack:                   # sits on the tray; pose given in the instrument_table frame
    parent: instrument_table
    pos: [-0.08, 0.0, 0.78]
    yaw: 0.0
  surgeon:                     # static mannequin at the operating table's east side, facing west
    pos: [23.85, -19.05, 0.0]
    yaw: 3.1415927

# Instruments start upright in the rack. slot = index along the rack's +y (0..6, pitch 0.09 m, centred).
rack_slots:
  scalpel_handle: 0
  adson_forceps: 1
  angled_tweezers: 2
  scissors: 3
  needle_driver: 4
  veress_needle: 5
  trocar: 6

# Suggested robot stances (pelvis x, y, yaw) for the mission's locations.yaml. The mission owns locations.yaml;
# these are what the object layout was designed around (reach analysis in README.md).
robot_stances:
  theatre_instrument_table: [25.60, -20.19, -1.5707963]   # pelvis 0.33 m from the rack row, facing it
  theatre_surgeon_side: [23.80, -18.25, -1.5707963]       # surgeon's hand 0.45 m ahead, 0.20 m to the right

# Scene props that occupy the surgeon's standing spot. Both sims drop them (Isaac: deactivated in the
# theatre layer, together with their collider boxes; MuJoCo: skip these boxes of hospital_boxes.json).
remove_scene_props:
  - sm_surgicalchair_a01_01
  - sm_surgicalchair_a01_02
